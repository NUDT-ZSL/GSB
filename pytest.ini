[pytest]
# Make `contour_tool` and the tests' helper module (`conftest`) importable
# regardless of the directory pytest is invoked from.
#   .      -> project root (import contour_tool)
#   tests  -> tests/conftest.py, so `from conftest import ...` works as a
#             top-level module instead of relying on rootdir insertion.
pythonpath = . tests
testpaths = tests
