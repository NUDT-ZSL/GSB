[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-engine"
version = "1.0.0"
description = "Offline baseline drift attribution and disposition adjudication engine"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.scripts]
drift-engine = "drift_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
