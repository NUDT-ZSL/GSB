[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animrecalc"
version = "1.0.0"
description = "Deterministic offline skeletal animation keyframe editing and incremental recomputation"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
animrecalc = "animrecalc.cli:main"

[tool.setuptools.packages.find]
include = ["animrecalc*"]
