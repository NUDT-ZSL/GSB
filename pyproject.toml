[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbom-audit-toolkit"
version = "1.0.0"
description = "Deterministic cross-generation SBOM merge, dependency closure and checkpoint audit toolkit"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sbom-audit = "sbom_audit.cli:main"
sbom-audit-samples = "sbom_audit.samplegen:main"

[tool.setuptools.packages.find]
include = ["sbom_audit*"]
