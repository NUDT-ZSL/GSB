[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-gemm-bmm"
version = "1.0.0"
description = "Adaptive tiled GEMM and BMM component with deterministic reports"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
readme = "README.md"

[tool.setuptools.packages.find]
include = ["gemm_ops*"]
