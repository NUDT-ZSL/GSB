[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sso-ticket-guard"
version = "1.0.0"
description = "Deterministic offline SSO ticket validation component"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sso-ticket-guard = "sso_ticket_guard.cli:main"

[tool.setuptools.packages.find]
include = ["sso_ticket_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

