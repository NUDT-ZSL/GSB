[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multilabel-lab"
version = "1.0.0"
description = "Deterministic multi-label classification with snapshot versioning, fault injection, and reproducibility verification"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.setuptools.packages.find]
include = ["multilabel_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
