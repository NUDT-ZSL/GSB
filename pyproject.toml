[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "silattr"
version = "1.0.0"
description = "Deterministic silence-segment energy event attribution component for 16kHz mono call recordings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[tool.setuptools.packages.find]
where = ["src"]

