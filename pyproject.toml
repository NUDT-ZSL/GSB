[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddp-ckpt-lab"
version = "1.0.0"
description = "Local deterministic DDP checkpoint and restore consistency verifier"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools.packages.find]
include = ["ddp_ckpt_lab*"]
