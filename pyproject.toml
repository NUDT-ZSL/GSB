[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphstore"
version = "0.1.0"
description = "Deterministic local graph snapshot merge, index and traversal engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
graphstore = "graphstore.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

