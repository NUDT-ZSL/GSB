[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-diag"
version = "1.0.0"
description = "Deterministic Serverless cold-start and concurrency diagnostics engine"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.32,<1.0"
]

[project.scripts]
cold-diag = "cold_diag.cli:main"

[tool.setuptools.packages.find]
include = ["cold_diag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
