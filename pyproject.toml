[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-ledger"
version = "0.1.0"
description = "Deterministic lease-quota ledger with drift thresholds, fair scheduling, and crash recovery"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
quota-ledger = "quota_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["quota_ledger*"]

