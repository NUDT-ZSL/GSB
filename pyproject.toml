[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shardpipe"
version = "0.1.0"
description = "Deterministic local shard-cache and prefetch scheduling control plane"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
numpy = ["numpy>=1.24"]

[project.scripts]
shardpipe = "shardpipe.cli:main"

[tool.setuptools.packages.find]
include = ["shardpipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
