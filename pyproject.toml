[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiofp"
version = "1.0.0"
description = "Deterministic local WAV fingerprint retrieval"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools.packages.find]
include = ["audiofp*"]
