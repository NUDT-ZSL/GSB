[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvcc-edit"
version = "1.0.0"
description = "Deterministic MVCC visibility editor with SQLite snapshot recovery"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
mvcc-edit = "mvcc_app.cli:main"

[tool.setuptools.packages.find]
include = ["mvcc_app*"]

