[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "summary-precision-pipeline"
version = "1.0.0"
description = "Deterministic extractive summarization pipeline with numeric error attribution"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
summary-pipeline = "summarize_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

