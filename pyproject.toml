[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsn-workbench"
version = "0.1.0"
description = "Deterministic domain segmentation and POS-tagging diagnostics"
requires-python = ">=3.10"

[project.scripts]
dsn-workbench = "dsn_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["dsn_workbench*"]

