[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataplane-consistency"
version = "1.0.0"
description = "Deterministic training/inference data editing, cache recomputation and recovery workbench"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
dataplane = "dataplane.cli:main"

[tool.setuptools.packages.find]
include = ["dataplane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
