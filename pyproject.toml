[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-dbpool"
version = "0.1.0"
description = "Deterministic local database connection-pool engine for loopback samples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
  "numpy>=1.24",
  "pytest>=8.0",
]

[project.scripts]
dbpool = "dbpool.cli:main"

[tool.setuptools.packages.find]
include = ["dbpool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
