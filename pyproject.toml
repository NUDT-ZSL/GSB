[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matforge"
version = "0.1.0"
description = "Deterministic local texture and material generation studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
matforge = "matforge.cli:main"

[tool.setuptools.packages.find]
include = ["matforge*"]

[tool.setuptools.package-data]
matforge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

