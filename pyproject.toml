[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-delivery-gateway"
version = "0.1.0"
description = "Deterministic local delivery catch-up gateway with SQLite token ledger"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
delivery-gateway = "delivery_gateway.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

