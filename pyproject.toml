[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coref-event-pipeline"
version = "0.1.0"
description = "Deterministic local event coreference pipeline with incremental merge and arbitration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
coref-pipeline = "coref_pipeline.cli:main"
coref-generate = "coref_pipeline.generator:main"

[tool.setuptools.packages.find]
include = ["coref_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
