[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chunkmeta"
version = "0.1.0"
description = "Local object-store chunking and metadata management with controlled fixed-point diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["chunkmeta"]
