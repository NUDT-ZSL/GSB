[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensitive-flow"
version = "0.1.0"
description = "Offline sensitive-field lineage tracking and edit validation workbench"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sensitive-flow = "sensitive_flow.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["sensitive_flow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
