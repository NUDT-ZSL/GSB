[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dimdiag"
version = "0.1.0"
description = "Deterministic dimensionality-reduction precision diagnostics workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
]

[project.scripts]
dimdiag = "dimdiag.cli:main"

[tool.setuptools.packages.find]
include = ["dimdiag*"]

[tool.setuptools.package-data]
dimdiag = ["static/*.html"]

