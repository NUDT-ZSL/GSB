[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layout-reading-order"
version = "0.1.0"
description = "Deterministic document-layout reading-order analysis with incremental invalidation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2.1"]

[project.scripts]
layout-order = "layout_order.cli:main"

[tool.setuptools]
packages = ["layout_order"]

