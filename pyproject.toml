[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustman-offline"
version = "1.0.0"
description = "Deterministic offline certificate-chain trust manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
trustman = "trustman.cli:main"

[tool.setuptools.packages.find]
include = ["trustman*"]
