[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-guard"
version = "1.0.0"
description = "Deterministic process isolation and capability revocation workbench for Windows policy samples"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.2.0"]

[project.scripts]
sandbox-guard = "sandbox_guard.cli:main"

[tool.setuptools.packages.find]
include = ["sandbox_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
