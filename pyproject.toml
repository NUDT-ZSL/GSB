[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-pose-diagnostic"
version = "0.1.0"
description = "Deterministic multi-view pose post-processing diagnostic workbench"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PySide6>=6.6",
]

[project.scripts]
pose-diag = "pose_diag.cli:main"

[tool.setuptools.packages.find]
include = ["pose_diag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

