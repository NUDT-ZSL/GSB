[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointcloud-workbench"
version = "1.0.0"
description = "Deterministic offline point-cloud block renderer and diagnostic workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
pcwb = "pointcloud_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["pointcloud_workbench*"]

