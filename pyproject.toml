[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medvol-raycast"
version = "0.1.0"
description = "Deterministic offline ray-casting volume renderer for medical visualization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "Pillow>=10",
    "PyOpenGL>=3.1.7",
    "PyOpenGL_accelerate>=3.1.7",
    "glfw>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

