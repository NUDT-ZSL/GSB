[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotline-diagnostics"
version = "1.0.0"
description = "Deterministic multi-turn slot state diagnostics with lineage replay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
slotline = "slotline.cli:main"

[tool.setuptools.packages.find]
include = ["slotline*"]

[tool.setuptools.package-data]
slotline = ["web/*.html"]
