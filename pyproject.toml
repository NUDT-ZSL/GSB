[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelwb"
version = "1.0.0"
description = "Offline model manifest, patch, gray-release, and recovery workbench"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4"]

[project.scripts]
modelwb = "modelwb.cli:main"

[tool.setuptools.packages.find]
include = ["modelwb*"]
