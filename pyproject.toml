[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pref-align-workbench"
version = "0.1.0"
description = "Deterministic local workbench for preference-alignment data preparation diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pref-workbench = "prefworkbench.cli:main"

[tool.setuptools.packages.find]
include = ["prefworkbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

