[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-recall"
version = "0.1.0"
description = "Deterministic local sparse-recall index prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4"]

[project.scripts]
sparse-recall = "sparse_recall.cli:main"

[tool.setuptools.packages.find]
include = ["sparse_recall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
