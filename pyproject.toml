[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sampling-compat-lab"
version = "1.0.0"
description = "Local sampling configuration interoperability and deterministic decoding lab"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
]

[project.scripts]
sampling-compat = "sampling_compat.cli:main"

[tool.setuptools.packages.find]
include = ["sampling_compat*"]
