[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signhand-sdf"
version = "1.0.0"
description = "Deterministic SDF hand animation and verification kernel"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
signhand = "signhand.cli:main"

[tool.setuptools.packages.find]
include = ["signhand*"]

