[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-decision-pipeline"
version = "1.0.0"
description = "Deterministic SRE rate-limit, circuit-breaker and degradation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.3",
  "pytest-json-report==1.5.0",
]

[project.scripts]
sre-pipeline = "sre_pipeline.cli:main"

[tool.setuptools]
packages = ["sre_pipeline"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

