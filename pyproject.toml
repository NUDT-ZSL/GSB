[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantdiag"
version = "0.1.0"
description = "Local deterministic CNN quantization diagnostics workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "PyQt5>=5.15"]

[project.scripts]
quantdiag = "quantdiag.cli:main"

[tool.setuptools.packages.find]
include = ["quantdiag*"]
