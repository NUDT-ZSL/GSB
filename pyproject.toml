[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-diag"
version = "0.1.0"
description = "Deterministic offline tabular feature encoding and selection diagnostic engine"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4"]

[project.scripts]
feature-diag = "feature_diag.cli:main"

[tool.setuptools.packages.find]
include = ["feature_diag*"]
