[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grayroll"
version = "1.0.0"
description = "Deterministic local gray-release and rollback-window orchestrator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2"]

[project.scripts]
grayroll = "grayroll.cli:main"

[tool.setuptools.packages.find]
include = ["grayroll*"]
