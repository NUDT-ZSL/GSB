[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quanttrace-lab"
version = "1.0.0"
description = "Deterministic quantization, blocked inference, snapshot recovery and local diagnostics workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools]
packages = ["quantlab", "tests"]

[tool.setuptools.package-data]
quantlab = ["static/*"]
