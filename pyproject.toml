[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-post"
version = "1.0.0"
description = "Deterministic local meeting interpretation post-production toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2"]

[project.scripts]
meeting-post = "meeting_post.cli:main"

[tool.setuptools.packages.find]
include = ["meeting_post*"]
