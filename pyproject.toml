[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-precision"
version = "0.1.0"
description = "Deterministic blocked SpMM/SpSpMM kernels with precision diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.scripts]
sparse-precision = "sparse_precision.cli:main"

[tool.setuptools.packages.find]
include = ["sparse_precision*"]

