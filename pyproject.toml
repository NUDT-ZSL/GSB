[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynabatch"
version = "1.0.0"
description = "Deterministic local inference dynamic batching and diagnostics engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
dynabatch = "dynabatch.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["dynabatch"]
