[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-diffusion-workbench"
version = "0.1.0"
description = "Deterministic staged diffusion renderer with content-addressed incremental invalidation"
requires-python = ">=3.11.0rc1"
dependencies = ["numpy>=1.26,<2.3", "Pillow>=10,<13"]

[project.scripts]
imgdiff = "incremental_diffusion.cli:main"

[tool.setuptools.packages.find]
include = ["incremental_diffusion*"]
