[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsl-workbench"
version = "0.1.0"
description = "Offline parser and diagnostic workbench for BSL (Binary Segment Log)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest==8.2.0",
  "numpy==1.26.4",
]

[project.scripts]
bsl-workbench = "bsl_workbench.cli:main"
bsl = "bsl_workbench.cli:main"
bsl-samples = "bsl_workbench.generator:main"

[tool.setuptools.packages.find]
include = ["bsl_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
