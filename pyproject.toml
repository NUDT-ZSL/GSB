[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-reopt"
version = "0.1.0"
description = "Deterministic runtime adaptive re-optimization for local streaming join pipelines"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stream-reopt = "stream_reopt.cli:main"

[tool.setuptools.packages.find]
include = ["stream_reopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

