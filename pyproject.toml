[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-serverless-coldstart"
version = "1.0.0"
description = "Deterministic local serverless cold-start, concurrency, and layer invalidation engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
coldstart = "serverless_engine.cli:main"

[tool.setuptools.packages.find]
include = ["serverless_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
