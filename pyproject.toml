[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphtrace-ocrlab"
version = "1.0.0"
description = "Deterministic local OCR data editing, injection, and snapshot laboratory"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
]

[project.scripts]
ocrlab = "ocrlab.cli:main"

[tool.setuptools.packages.find]
include = ["ocrlab*"]

