[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-emotion-incremental"
version = "0.1.0"
description = "Deterministic dialogue speech emotion analysis with incremental cache lineage"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["voice_emotion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
