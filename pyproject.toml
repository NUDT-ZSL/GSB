[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wadiag"
version = "0.1.0"
description = "Deterministic LSM-style write-amplification diagnostics and compaction policy tool"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.24"]

[project.scripts]
wadiag = "wadiag.cli:main"

[tool.setuptools.packages.find]
include = ["wadiag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
