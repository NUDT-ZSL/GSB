[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-voice-dialog"
version = "1.0.0"
description = "Deterministic acoustic emotion and dialogue-understanding component"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
voice-dialog = "voice_dialog.cli:main"
voice-dialog-generate = "voice_dialog.synthetic:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
