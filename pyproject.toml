[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-interop"
version = "0.1.0"
description = "Deterministic Chinese intent configuration interoperability component"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
intent-interop = "intent_interop.cli:main"

[tool.setuptools.packages.find]
include = ["intent_interop*"]
