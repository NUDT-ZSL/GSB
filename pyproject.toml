[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsb-volumetric-renderer"
version = "0.1.0"
description = "Deterministic local volumetric offscreen renderer with fixed-point error diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
gsb-render = "volumetric_engine.cli:main"

[tool.setuptools.packages.find]
include = ["volumetric_engine*"]

