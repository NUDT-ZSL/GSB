[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narrative-gaussian-workbench"
version = "1.0.0"
description = "Deterministic transparent 3D Gaussian narrative render and sorting validator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
narrative-workbench = "narrative_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["narrative_workbench*"]
