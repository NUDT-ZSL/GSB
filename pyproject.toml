[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmm-stage-recovery"
version = "1.0.0"
description = "Deterministic local GEMM/BMM pipeline with staged snapshots and crash recovery"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
bmm-pipeline = "bmm_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["bmm_pipeline*"]
