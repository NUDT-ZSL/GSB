[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rope-arbiter"
version = "0.1.0"
description = "Deterministic RoPE variant arbitration with content-addressed caching"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["rope_arbiter*"]
