[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpus-dedup-workbench"
version = "0.1.0"
description = "Local deterministic corpus dedup diagnostics workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
]

[project.scripts]
dedup-workbench = "corpus_dedup_workbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corpus_dedup_workbench = ["webui/*.html", "webui/*.css", "webui/*.js"]

