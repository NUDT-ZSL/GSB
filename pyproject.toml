[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-risk"
version = "1.0.0"
description = "Deterministic local customer-service sentiment and risk editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
dialogue-risk = "dialogue_risk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

