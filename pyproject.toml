[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quicsim-local"
version = "0.1.0"
description = "Deterministic local QUIC loss-recovery and congestion-control simulator"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
quicsim = "quicsim.cli:main"

[tool.setuptools.packages.find]
include = ["quicsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

