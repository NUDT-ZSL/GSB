[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-instruction-workbench"
version = "1.0.0"
description = "Deterministic local instruction-sample construction and precision diagnostics"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

