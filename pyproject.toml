[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-forge"
version = "0.1.0"
description = "Offline deterministic audit event correlation and forensics tool"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
audit-forge = "audit_forge.cli:main"

[tool.setuptools.packages.find]
include = ["audit_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

