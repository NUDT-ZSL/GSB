[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gemm-bmm-workbench"
version = "1.0.0"
description = "Deterministic incremental GEMM/BMM operator diagnostics workbench"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4"]

[project.scripts]
wb = "gemm_bmm_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["gemm_bmm_workbench*"]

[tool.setuptools.package-data]
gemm_bmm_workbench = ["static/*.html", "static/*.css", "static/*.js"]
