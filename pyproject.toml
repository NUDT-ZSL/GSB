[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walrec"
version = "1.0.0"
description = "Deterministic local WAL replay and checkpoint recovery"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
walrec = "walrec.cli:main"

[tool.setuptools]
packages = ["walrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
