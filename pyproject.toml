[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tls-trust-pipeline"
version = "1.0.0"
description = "Deterministic local TLS chain validation and incremental trust-store pipeline"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tls-trust = "tls_trust_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

