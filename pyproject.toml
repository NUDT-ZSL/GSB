[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcp-trajectory-engine"
version = "1.0.0"
description = "Deterministic local TCP state and congestion-control trajectory engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["numpy>=1.21"]

[project.scripts]
tcp-trajectory = "tcp_engine.cli:main"

[tool.setuptools.packages.find]
include = ["tcp_engine*"]

