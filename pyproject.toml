[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmpool-arbiter"
version = "1.0.0"
description = "Deterministic local VM pool capacity and cost budget arbiter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["numpy>=1.26"]

[project.scripts]
vmpool = "vmpool.cli:main"

[tool.setuptools.packages.find]
include = ["vmpool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
