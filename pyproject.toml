[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osl-forensics-prototype"
version = "0.1.0"
description = "Deterministic OSL parsing, SQLite attestation ledger, budgets and recovery prototype"
requires-python = ">=3.10"
dependencies = ["numpy", "pytest"]

[project.scripts]
osl-forensics = "osl_forensics.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["osl_forensics*"]
