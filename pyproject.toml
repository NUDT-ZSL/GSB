[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-vad-local"
version = "1.0.0"
description = "Deterministic local speech-activity interval editing and replay"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
meeting-vad = "meeting_vad.app:main"

[tool.setuptools.packages.find]
include = ["meeting_vad*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
