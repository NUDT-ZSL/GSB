[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-moe-router"
version = "0.1.0"
description = "Deterministic block-routed sparse MoE reference component"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
moe-router = "moe_router.cli:main"

[tool.setuptools.packages.find]
include = ["moe_router*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

