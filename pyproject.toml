[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "peft-snapshot-diagnostics"
version = "0.1.0"
description = "Deterministic local PEFT snapshot, migration, recovery and diagnostics workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
peft-diag = "peft_diag.cli:main"

[tool.setuptools.packages.find]
include = ["peft_diag*"]

