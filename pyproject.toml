[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dialogue-emotion-cache"
version = "1.0.0"
description = "Deterministic dialogue-level speech emotion analysis DAG with incremental content-addressed caching and lineage replay"
requires-python = ">=3.10"
dependencies = ["numpy>=1.20"]

[tool.setuptools.packages.find]
include = ["dialog_emotion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
