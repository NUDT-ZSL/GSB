[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lockledger"
version = "1.0.0"
description = "Deterministic transaction lock-wait precision ledger diagnostic engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lockledger = "lockledger.cli:main"

[tool.setuptools]
packages = ["lockledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

