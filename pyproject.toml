[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-intent-engine"
version = "1.0.0"
description = "Deterministic Chinese intent classification and BIESO slot extraction for local support tickets"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
intent-engine = "intent_engine.cli:main"

[tool.setuptools.packages.find]
include = ["intent_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

