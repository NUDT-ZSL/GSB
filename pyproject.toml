[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnel-workbench"
version = "0.1.0"
description = "Deterministic local tunnel/VPN forwarding workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "numpy>=1.26",
]

[project.scripts]
tunnelwb = "tunnel_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["tunnel_workbench*"]

