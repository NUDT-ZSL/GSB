[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-diag"
version = "0.1.0"
description = "Deterministic local diagnostic engine for blockwise latent denoising"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
latent-diag = "latent_diag.cli:main"

[tool.setuptools.packages.find]
include = ["latent_diag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

