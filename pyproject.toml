[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binning-diagnostic-engine"
version = "1.0.0"
description = "Deterministic tabular binning, encoding, caching and recovery engine"
requires-python = ">=3.8"
dependencies = ["numpy>=1.21"]

[tool.setuptools]
packages = ["binning_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
