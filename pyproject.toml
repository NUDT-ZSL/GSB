[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multipart-store"
version = "0.1.0"
description = "Local object-store multipart upload session manager"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
multipart-store = "multipart_store.cli:main"

[tool.setuptools.packages.find]
include = ["multipart_store*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
