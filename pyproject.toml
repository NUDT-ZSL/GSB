[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-authz"
version = "1.0.0"
description = "Deterministic offline MFA authorization, ledger, closure and checkpoint component"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
offline-authz = "offline_authz.cli:main"
authz = "offline_authz.cli:main"

[tool.setuptools.packages.find]
include = ["offline_authz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
