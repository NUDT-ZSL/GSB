[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdiag-workbench"
version = "1.0.0"
description = "Deterministic local diagnostic workbench for RAG and tool-call DAGs"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
ragdiag = "ragdiag.cli:main"

[tool.setuptools.packages.find]
include = ["ragdiag*"]

[tool.unittest]
start-directory = "tests"

