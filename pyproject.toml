[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-stream-agg"
version = "0.1.0"
description = "Deterministic, recoverable event-time window aggregation over SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sensor-agg-demo = "sensor_stream_agg.demo:main"

[tool.setuptools]
packages = ["sensor_stream_agg"]
