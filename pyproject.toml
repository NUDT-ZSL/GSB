[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-eventbus-middleware"
version = "1.0.0"
description = "Deterministic local event-bus bridge middleware for v1/v2 event formats"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0,<4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
eventbus = "eventbus.cli:main"

[tool.setuptools.packages.find]
include = ["eventbus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
