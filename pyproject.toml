[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memguard"
version = "0.1.0"
description = "Deterministic memory-boundary guard with SQLite checkpointing"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
memguard = "memguard.cli:main"

[tool.setuptools]
packages = ["memguard"]
