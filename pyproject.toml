[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-tier-engine"
version = "1.0.0"
description = "Deterministic local stream/batch emotion-tier engine for synthetic contact-center dialogs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools]
packages = ["emotion_engine"]
