[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-graphstore"
version = "1.0.0"
description = "Deterministic local graph snapshot merge, indexing and budgeted parallel traversal"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
graphstore = "graphstore.cli:main"

[tool.setuptools.packages.find]
include = ["graphstore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

