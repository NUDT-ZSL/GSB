[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-deterministic-workbench"
version = "1.0.0"
description = "Deterministic offline TTS acoustic renderer with resumable edits"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "soundfile>=0.12"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tts-workbench = "tts_workbench.__main__:main"

[tool.setuptools.packages.find]
include = ["tts_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
