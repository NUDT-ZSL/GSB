[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igeval"
version = "1.0.0"
description = "Deterministic image-text generation quality evaluation component"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[tool.setuptools.packages.find]
include = ["igeval*"]

