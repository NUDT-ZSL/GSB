[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceprint-diag"
version = "1.0.0"
description = "Deterministic fixed-point speaker-embedding inference and diagnostics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
voiceprint-diag = "voiceprint_diag.cli:main"

[tool.setuptools.packages.find]
include = ["voiceprint_diag*"]

