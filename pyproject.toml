[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-inference-gateway-lab"
version = "0.1.0"
description = "Local ML inference gateway fingerprint and ledger diagnostics workbench"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["ml_gateway*"]
