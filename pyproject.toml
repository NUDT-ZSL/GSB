[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-qc-first-slice"
version = "0.1.0"
description = "Deterministic chunked audio quality-control threshold migration, drift adjudication, and recoverable snapshots"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
audio-qc = "audio_qc.cli:main"

[tool.setuptools.packages.find]
include = ["audio_qc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
