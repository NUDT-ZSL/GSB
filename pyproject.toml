[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-failover-diagnostics"
version = "1.0.0"
description = "Deterministic failover and isolation diagnostic workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.110.0",
  "uvicorn==0.29.0",
  "numpy==1.26.4",
]

[project.optional-dependencies]
test = [
  "httpx==0.27.2",
  "pytest==8.3.3",
]

[tool.setuptools.packages.find]
include = ["diagnostic_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

