[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numeric-consistency-workbench"
version = "1.0.0"
description = "Local deterministic numerical consistency diagnostic workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["numeric_workbench*"]
