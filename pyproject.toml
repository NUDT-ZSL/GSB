[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capbench-workbench"
version = "0.1.0"
description = "Deterministic local multi-tenant load-test capacity workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
capbench = "capbench.cli:main"

[tool.setuptools.packages.find]
include = ["capbench*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

