[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batchdiag"
version = "1.0.0"
description = "Local dynamic-batching precision spectrum diagnostics workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
batchdiag = "batchdiag.cli:main"

[tool.setuptools.packages.find]
include = ["batchdiag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
