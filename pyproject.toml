[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchical-quota-ledger"
version = "0.1.0"
description = "Deterministic hierarchical storage quota and rate-limit ledger"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
quota-ledger = "quota_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["quota_ledger*"]

