[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-op-workbench"
version = "1.0.0"
description = "Deterministic block execution, cache invalidation, and diagnostics workbench for Softmax and LayerNorm"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4"]

[project.scripts]
transformer-op-workbench = "transformer_diag.cli:main"

[tool.setuptools.packages.find]
include = ["transformer_diag*"]

