[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digit-ocr-incremental"
version = "0.1.0"
description = "Deterministic incremental handwritten-digit OCR with lineage replay"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.scripts]
digit-ocr-demo = "digit_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["digit_ocr*"]
