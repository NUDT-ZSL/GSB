[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-editor"
version = "1.0.0"
description = "Deterministic relation/event v1-v2 project editor"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
domain-editor = "domain_editor.cli:main"

[tool.setuptools.packages.find]
include = ["domain_editor*"]
