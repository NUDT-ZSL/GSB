[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptic-audit"
version = "1.0.0"
description = "Active probing and tri-state ground-truth ledger consistency engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
panoptic-audit = "panoptic_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
