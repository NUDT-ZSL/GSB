[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-emotion-state"
version = "1.0.0"
description = "Deterministic local dialog-level speech emotion analysis with recoverable stage snapshots"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
]

[project.scripts]
voice-emotion = "voice_state.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

