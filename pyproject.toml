[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-mfa-guard"
version = "0.1.0"
description = "Deterministic offline multi-factor authentication decision component"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
  "numpy>=1.24",
  "pytest>=8",
]

[project.scripts]
mfa-guard = "mfa_guard.cli:main"

[tool.setuptools.packages.find]
include = ["mfa_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

