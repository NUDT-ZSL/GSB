[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sequential-mq"
version = "1.0.0"
description = "Local deterministic sequential message middleware"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
smq = "sequential_mq.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

