[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-netdiag"
version = "1.0.0"
description = "Deterministic local loopback packet-loss and network fault diagnosis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["numpy>=1.24", "pytest>=8"]

[project.scripts]
netdiag = "netdiag.cli:main"

[tool.setuptools.packages.find]
include = ["netdiag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
