[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneopt"
version = "0.1.0"
description = "Deterministic local scene representation optimization pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4"]

[project.scripts]
sceneopt = "sceneopt.cli:main"

[tool.setuptools.packages.find]
include = ["sceneopt*"]

