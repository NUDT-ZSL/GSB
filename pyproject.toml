[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-attn-cache"
version = "0.1.0"
description = "Deterministic block attention with content-addressed incremental caching"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["flash_attn_cache*"]
