[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler-diag"
version = "1.0.0"
description = "Deterministic local scheduling attribution and diagnostics workbench"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4"]

[project.scripts]
scheduler-diag = "scheduler_diag.cli:main"

[tool.setuptools.packages.find]
include = ["scheduler_diag*"]
