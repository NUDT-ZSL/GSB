[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctr-deterministic-rerank"
version = "1.0.0"
description = "Deterministic local CTR reranking pipeline and validation tool"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=5.4,<7",
]

[project.scripts]
ctr-pipeline = "ctr_pipeline.cli:main"

[tool.setuptools]
packages = ["ctr_pipeline"]
