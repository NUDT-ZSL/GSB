[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsb-diagnostic-engine"
version = "0.1.0"
description = "Deterministic diagnostic engine for regularized tabular binary classifiers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
diagnostic-engine = "diagnostic_engine.cli:main"

[tool.setuptools.packages.find]
include = ["diagnostic_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


