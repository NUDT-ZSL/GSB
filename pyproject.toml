[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-instruction-data-editor"
version = "0.1.0"
description = "Deterministic six-stage LLM instruction-tuning data construction editor"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
ifdata = "ifdata.cli:main"

[tool.setuptools.packages.find]
include = ["ifdata*"]

