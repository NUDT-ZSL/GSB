[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-summary"
version = "1.0.0"
description = "Deterministic customer-support summary and rewrite DAG"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4"]

[project.scripts]
support-summary = "support_summary.cli:main"

[tool.setuptools.packages.find]
include = ["support_summary*"]
