[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-masker"
version = "0.1.0"
description = "Deterministic offline audit-event masking ledger"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
audit-masker = "audit_masker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
