[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-columnar-engine"
version = "0.1.0"
description = "Deterministic local columnar plan rewrite, scheduling, and recovery engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pytest>=8.0",
]

[project.scripts]
columnar-engine = "columnar_engine.cli:main"

[tool.setuptools.packages.find]
include = ["columnar_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

