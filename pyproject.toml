[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sampling-ops"
version = "1.0.0"
description = "Deterministic TopK and sampling operators for local LLM inference pipelines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
sampling-ops = "sampling_ops.cli:main"

[tool.setuptools]
packages = ["sampling_ops"]

