[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "query-understanding"
version = "1.0.0"
description = "Deterministic query normalization, slot tagging, intent ranking and scale-aware evaluation."
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[tool.setuptools.packages.find]
include = ["query_understanding*"]

