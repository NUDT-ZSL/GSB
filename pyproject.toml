[project]
name = "latentflow-studio"
version = "1.0.0"
description = "Deterministic local video generation and chunked preview workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
