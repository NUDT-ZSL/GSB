[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-diag"
version = "1.0.0"
description = "Deterministic execution-order and cost-model diagnostics workbench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
engine-diag = "engine_diag.cli:main"

[tool.setuptools.packages.find]
include = ["engine_diag*"]

