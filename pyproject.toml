[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memguard"
version = "1.0.0"
description = "Deterministic memory-mapping attribute guard, credential ledger, and recovery verifier"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
memguard = "memguard.cli:main"

[tool.setuptools.packages.find]
include = ["memguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
