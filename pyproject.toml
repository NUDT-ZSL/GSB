[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qconv-workbench"
version = "1.0.0"
description = "Deterministic low-precision quantized convolution editing workbench"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["qconv*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]

