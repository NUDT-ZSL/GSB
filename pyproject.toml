[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-burnrate"
version = "0.1.0"
description = "Deterministic, fixed-point SRE error-budget burn-rate evaluation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
license = "Proprietary"
authors = [{ name = "SRE Feedback Workspace" }]

[project.scripts]
sre-burnrate = "sre_burnrate.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
