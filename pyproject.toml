[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lbworkbench"
version = "1.0.0"
description = "Local cross-version load-balancer state mapping and drift diagnostics"
requires-python = ">=3.10"
dependencies = [
    "flask==3.0.3",
    "requests==2.32.3",
]

[project.scripts]
lbworkbench = "lbworkbench.cli:main"

[tool.setuptools]
packages = ["lbworkbench"]
include-package-data = true

[tool.setuptools.package-data]
lbworkbench = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
