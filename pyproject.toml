[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uid-diagnostic-engine"
version = "1.0.0"
description = "Deterministic multivariate time-series precision diagnostic engine"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
diagnostic-engine = "diagnostic_engine.cli:main"

[tool.setuptools.packages.find]
include = ["diagnostic_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
