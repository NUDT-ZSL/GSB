[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sampling-diag"
version = "0.1.0"
description = "Deterministic TopK/TopP sampling interoperability and migration diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.scripts]
llm-sampling-diag = "llm_sampling_diag.cli:main"

[tool.setuptools.packages.find]
include = ["llm_sampling_diag*"]

