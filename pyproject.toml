[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smuggling-engine"
version = "1.0.0"
description = "Deterministic offline HTTP request smuggling decision and evidence engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
smuggling-engine = "smuggling_engine.cli:main"

[tool.setuptools.packages.find]
include = ["smuggling_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

