[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-scaler-diagnostics"
version = "1.0.0"
description = "Deterministic local inference autoscaler control plane and diagnostic workbench"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "numpy>=1.26",
]

[project.scripts]
scaler = "scaler.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["scaler*"]

[tool.setuptools.package-data]
scaler = ["templates/*.html"]
