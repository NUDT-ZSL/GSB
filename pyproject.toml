[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ckptlab"
version = "0.1.0"
description = "Deterministic sharded checkpoint manager and diagnostic workbench"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "Flask>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ckptlab = "ckptlab.cli:main"

[tool.setuptools.packages.find]
include = ["ckptlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
