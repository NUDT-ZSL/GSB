[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-convergence"
version = "0.1.0"
description = "Deterministic multi-environment deployment manifest convergence engine"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
deploy-convergence = "deploy_convergence.cli:main"

[tool.setuptools.packages.find]
include = ["deploy_convergence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
