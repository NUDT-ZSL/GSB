[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdrift"
version = "0.1.0"
description = "Deterministic local Kubernetes desired-state drift convergence engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
kdrift = "kdrift.cli:main"

[tool.setuptools.packages.find]
include = ["kdrift*"]

