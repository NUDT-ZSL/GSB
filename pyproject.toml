[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coldstart-ledger"
version = "1.0.0"
description = "Deterministic local cold-start quota ledger and preemption engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
coldstart-ledger = "coldstart_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["coldstart_ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

