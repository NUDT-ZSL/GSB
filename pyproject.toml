[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ner-governance"
version = "0.1.0"
description = "Deterministic NER label-set interoperability, adjudication and traceability"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.24"]

[project.scripts]
ner-governance = "ner_governance.cli:main"

[tool.setuptools.packages.find]
include = ["ner_governance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
