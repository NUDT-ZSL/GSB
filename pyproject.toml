[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal-feedback"
version = "0.1.0"
description = "Local monophonic vocal pitch, note, lyric and scoring analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
vocal-feedback = "vocal_feedback.cli:main"

[tool.setuptools.packages.find]
include = ["vocal_feedback*"]

