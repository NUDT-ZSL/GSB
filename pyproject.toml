[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-mv-engine"
version = "0.1.0"
description = "Deterministic local incremental materialized-view engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
mv-engine = "mvengine.cli:main"

[tool.setuptools.packages.find]
include = ["mvengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

