[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warbiter"
version = "1.0.0"
description = "Deterministic multi-tenant write-write conflict arbiter"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
warbiter = "warbiter.cli:main"

[tool.setuptools.packages.find]
include = ["warbiter*"]

