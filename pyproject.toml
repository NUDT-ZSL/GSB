[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opverify-local"
version = "1.0.0"
description = "Deterministic operator development and optimization verification service"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.scripts]
opverify = "opverify.cli:main"

[tool.setuptools.packages.find]
include = ["opverify*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
