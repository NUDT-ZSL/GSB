[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tierflow-arbitrator"
version = "1.0.0"
description = "Deterministic hot/cold tier migration adjudication and recovery component"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pytest>=8.0"]

[project.scripts]
tierflow = "tierflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
