experiment: high_cardinality_crosses
seed: 20261117
work_dir: .bench_work/high_card
workers: 4
impute_missing: true

columns:
  - {name: num_a, type: numeric, missing_rate: 0.02}
  - {name: num_b, type: numeric}
  - {name: cat_city, type: categorical_low, base_cardinality: 10}
  - {name: cat_channel, type: categorical_low, base_cardinality: 6}
  - {name: cat_device, type: categorical_high, base_cardinality: 200, missing_rate: 0.04}
  - {name: cat_merchant, type: categorical_high, base_cardinality: 500}
  - {name: cat_sku, type: categorical_high, base_cardinality: 1000}
  - {name: target, type: numeric}

target_column: target

scales:
  - {id: high_card, samples: 1500, feature_multiplier: 1.0, cardinality_multiplier: 4.0,
     note: 高基数交叉}

cross:
  min_order: 1
  max_order: 3
  whitelist: [cat_city, cat_channel, cat_device, cat_merchant, cat_sku]
  cardinality_budget: 48
  degrade_strategy: hash_bucket

reduction:
  methods: [pca, random_projection, variance]
  target_dim: 24
  variance_threshold: 0.02
