experiment: multi_scale_diagnostic
seed: 20261117
work_dir: .bench_work/multi
workers: 4
impute_missing: true

columns:
  - {name: num_a, type: numeric, missing_rate: 0.05}
  - {name: num_b, type: numeric}
  - {name: num_c, type: numeric_redundant, redundant_of: num_a, missing_rate: 0.02}
  - {name: cat_city, type: categorical_low, base_cardinality: 6, missing_rate: 0.04}
  - {name: cat_channel, type: categorical_low, base_cardinality: 4}
  - {name: cat_device, type: categorical_high, base_cardinality: 40, missing_rate: 0.08}
  - {name: cat_merchant, type: categorical_high, base_cardinality: 60}
  - {name: target, type: numeric}

target_column: target

scales:
  - {id: small_wide, samples: 60, feature_multiplier: 3.0, cardinality_multiplier: 1.0,
     note: 小样本大特征}
  - {id: medium, samples: 800, feature_multiplier: 2.0, cardinality_multiplier: 2.0,
     note: 中等规模}
  - {id: high_card, samples: 1500, feature_multiplier: 1.0, cardinality_multiplier: 4.0,
     note: 高基数交叉}

cross:
  min_order: 1
  max_order: 3
  whitelist: [cat_city, cat_channel, cat_device, cat_merchant]
  cardinality_budget: 48
  degrade_strategy: hash_bucket

reduction:
  methods: [variance, pca, random_projection]
  target_dim: 16
  variance_threshold: 0.01
