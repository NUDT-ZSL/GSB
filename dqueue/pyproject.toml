[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqueue"
version = "1.0.0"
description = "Local deterministic delayed-queue middleware with heap/timing-wheel scheduling"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
dqueue = "dqueue.cli:main"

[tool.setuptools]
packages = ["dqueue"]
